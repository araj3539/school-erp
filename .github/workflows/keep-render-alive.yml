name: Keep Render Service Alive

on:
  schedule:
    # Render free web services can spin down after inactivity.
    # Run every 10 minutes to keep the service warm.
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render API
        run: |
          curl --fail --silent --show-error --max-time 30 \
            --retry 2 \
            --retry-delay 5 \
            https://school-erp-api-6gm7.onrender.com/
