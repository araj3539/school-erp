name: AI Security Alert Analysis

on:
  workflow_run:
    workflows:
      - Semgrep
    types:
      - completed
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to analyze (for example refs/heads/main or refs/pull/123/merge)'
        required: false
        type: string
      state:
        description: 'Code scanning alert state to analyze'
        required: false
        default: open
        type: choice
        options:
          - open
          - closed
          - dismissed
          - fixed
      alert_numbers:
        description: 'Optional comma-separated alert numbers for a focused analysis'
        required: false
        type: string
      updated_after:
        description: 'Optional ISO timestamp; only alerts updated at or after this time are analyzed'
        required: false
        type: string

permissions:
  contents: read
  security-events: read
  actions: read

jobs:
  analyze:
    name: Analyze code scanning alerts
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout analyzer
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          sparse-checkout: |
            .github/scripts/security_alert_analyzer.py

      - name: Resolve target
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WORKFLOW_RUN_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          WORKFLOW_RUN_CREATED_AT: ${{ github.event.workflow_run.created_at }}
          DISPATCH_REF: ${{ inputs.ref }}
          DISPATCH_STATE: ${{ inputs.state }}
          DISPATCH_ALERT_NUMBERS: ${{ inputs.alert_numbers }}
          DISPATCH_UPDATED_AFTER: ${{ inputs.updated_after }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            REF="${DISPATCH_REF:-refs/heads/main}"
            STATE="${DISPATCH_STATE:-open}"
            ALERT_NUMBERS="${DISPATCH_ALERT_NUMBERS:-}"
            UPDATED_AFTER="${DISPATCH_UPDATED_AFTER:-}"
          elif [ -n "$WORKFLOW_RUN_PR_NUMBER" ]; then
            REF="refs/pull/${WORKFLOW_RUN_PR_NUMBER}/merge"
            STATE="open"
            ALERT_NUMBERS=""
            UPDATED_AFTER="$WORKFLOW_RUN_CREATED_AT"
          else
            REF="refs/heads/${WORKFLOW_RUN_HEAD_BRANCH:-main}"
            STATE="open"
            ALERT_NUMBERS=""
            UPDATED_AFTER="$WORKFLOW_RUN_CREATED_AT"
          fi
          {
            echo "ref=$REF"
            echo "state=$STATE"
            echo "alert_numbers=$ALERT_NUMBERS"
            echo "updated_after=$UPDATED_AFTER"
          } >> "$GITHUB_OUTPUT"

      - name: Analyze alerts with NVIDIA Nemotron
        id: analyze
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          TARGET_REF: ${{ steps.target.outputs.ref }}
          ALERT_STATE: ${{ steps.target.outputs.state }}
          ALERT_NUMBERS: ${{ steps.target.outputs.alert_numbers }}
          UPDATED_AFTER: ${{ steps.target.outputs.updated_after }}
        run: |
          python3 .github/scripts/security_alert_analyzer.py

      - name: Publish triage summary
        if: always()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          report_path = Path("security-alert-analysis/security-triage-report.json")
          if not report_path.exists():
              print("## Security Triage Report\n\nReport generation failed before an artifact could be created.")
              raise SystemExit(0)

          report = json.loads(report_path.read_text(encoding="utf-8"))
          rollup = report.get("rollup", {})
          verdicts = rollup.get("verdict", {})
          print("## Security Triage Report")
          print("")
          print(f"**[Open workflow run and artifact]({__import__('os').environ['RUN_URL']}#artifacts)**")
          print("")
          print("| Metric | Value |")
          print("| --- | ---: |")
          print(f"| Alerts selected | {report.get('alerts_seen', 0)} |")
          print(f"| Analyses completed | {report.get('analyses_completed', 0)} |")
          print(f"| Analysis failures | {len(report.get('analysis_failures', []))} |")
          print(f"| True positives | {verdicts.get('true_positive', 0)} |")
          print(f"| False positives | {verdicts.get('false_positive', 0)} |")
          print(f"| Needs investigation | {verdicts.get('needs_investigation', 0)} |")
          print("")
          print("The artifact is read-only triage output; no code-scanning alerts were modified.")
          PY

      - name: Upload consolidated security-triage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-triage-report-${{ github.run_id }}
          path: security-alert-analysis/security-triage-report.*
          if-no-files-found: error
          retention-days: 14
