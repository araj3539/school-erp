name: Phase 1 Build

on:
  push:
    branches: [main, phase1-security-hardening]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test --prefix shared
      - run: npm run test --prefix server
      - run: npm run test:e2e --prefix server -- --list
