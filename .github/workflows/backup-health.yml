name: Verify Backup Health

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Install rclone
        run: |
          set -euo pipefail
          curl -fsSL https://rclone.org/install.sh | sudo bash
          rclone version

      - name: Configure B2
        env:
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
        run: |
          set -euo pipefail
          test -n "$B2_KEY_ID" || { echo "Missing required secret: B2_KEY_ID"; exit 1; }
          test -n "$B2_APPLICATION_KEY" || { echo "Missing required secret: B2_APPLICATION_KEY"; exit 1; }
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [b2]
          type = b2
          account = $B2_KEY_ID
          key = $B2_APPLICATION_KEY
          EOF

      - name: Verify latest R2 backup manifest
        env:
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
        run: |
          set -euo pipefail
          test -n "$B2_BUCKET_NAME" || { echo "Missing required secret: B2_BUCKET_NAME"; exit 1; }
          rclone cat "b2:${B2_BUCKET_NAME}/metadata/r2-latest-manifest.json" > /tmp/r2-manifest.json
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          with open('/tmp/r2-manifest.json', encoding='utf-8') as f:
              data = json.load(f)
          completed = datetime.fromisoformat(data['completedAt'].replace('Z', '+00:00'))
          age_hours = (datetime.now(timezone.utc) - completed).total_seconds() / 3600
          print(f"R2 backup age: {age_hours:.2f} hours")
          if age_hours > 26:
              raise SystemExit('R2 backup is older than 26 hours')
          if data.get('objectCount', 0) <= 0:
              raise SystemExit('R2 manifest contains zero objects')
          PY

      - name: Verify latest MongoDB backup freshness and size
        env:
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
        run: |
          set -euo pipefail
          PATH_FILE=$(rclone cat "b2:${B2_BUCKET_NAME}/metadata/mongodb-latest-path.txt")
          test -n "$PATH_FILE"
          rclone size "$PATH_FILE"
          python - "$PATH_FILE" <<'PY'
          import re
          import sys
          from datetime import datetime, timezone
          path = sys.argv[1]
          match = re.search(r'(\d{8}T\d{6}Z)\.archive\.gz$', path)
          if not match:
              raise SystemExit('Latest MongoDB backup path has no valid timestamp')
          created = datetime.strptime(match.group(1), '%Y%m%dT%H%M%SZ').replace(tzinfo=timezone.utc)
          age_hours = (datetime.now(timezone.utc) - created).total_seconds() / 3600
          print(f"MongoDB backup age: {age_hours:.2f} hours")
          if age_hours > 26:
              raise SystemExit('MongoDB backup is older than 26 hours')
          PY

      - name: Failure notice
        if: failure()
        run: |
          echo "BACKUP HEALTH CHECK FAILED. Treat backups as stale and inspect GitHub Actions immediately."