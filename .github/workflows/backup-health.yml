name: Verify Backup Health

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Install rclone
        run: |
          set -euo pipefail
          curl -fsSL https://rclone.org/install.sh | sudo bash
          rclone version

      - name: Configure B2
        env:
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
        run: |
          set -euo pipefail
          test -n "$B2_KEY_ID" || { echo "Missing required secret: B2_KEY_ID"; exit 1; }
          test -n "$B2_APPLICATION_KEY" || { echo "Missing required secret: B2_APPLICATION_KEY"; exit 1; }
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [b2]
          type = b2
          account = $B2_KEY_ID
          key = $B2_APPLICATION_KEY
          EOF

      - name: Verify latest R2 backup state
        env:
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
        run: |
          set -euo pipefail
          test -n "$B2_BUCKET_NAME" || { echo "Missing required secret: B2_BUCKET_NAME"; exit 1; }
          rclone cat "b2:${B2_BUCKET_NAME}/metadata/r2-latest-manifest.json" > /tmp/r2-manifest.json
          test -s /tmp/r2-manifest.json || { echo "R2 backup manifest is empty"; exit 1; }
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          try:
              with open('/tmp/r2-manifest.json', encoding='utf-8') as f:
                  data = json.load(f)
          except (OSError, json.JSONDecodeError) as exc:
              raise SystemExit(f'R2 backup manifest is invalid JSON: {exc}')
          checked = datetime.fromisoformat(data['lastCheckedAt'].replace('Z', '+00:00'))
          age_hours = (datetime.now(timezone.utc) - checked).total_seconds() / 3600
          print(f"R2 backup last checked: {age_hours:.2f} hours ago")
          if age_hours > 26:
              raise SystemExit('R2 backup workflow has not successfully checked the source for more than 26 hours')
          if data.get('objectCount', 0) <= 0:
              raise SystemExit('R2 manifest contains zero objects')
          print(f"Last R2 content change: {data.get('lastChangedAt') or 'unknown'}")
          PY

      - name: Verify latest MongoDB backup state
        env:
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
        run: |
          set -euo pipefail
          if ! rclone cat "b2:${B2_BUCKET_NAME}/metadata/mongodb-latest.json" > /tmp/mongodb-latest.json 2>/dev/null; then
            echo "MongoDB backup metadata could not be read from B2."
            exit 1
          fi
          test -s /tmp/mongodb-latest.json || {
            echo "MongoDB backup metadata is empty. The MongoDB backup workflow must complete successfully before this health check can pass."
            exit 1
          }
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          try:
              with open('/tmp/mongodb-latest.json', encoding='utf-8') as f:
                  data = json.load(f)
          except (OSError, json.JSONDecodeError) as exc:
              raise SystemExit(f'MongoDB backup metadata is invalid JSON: {exc}')
          checked = datetime.fromisoformat(data['lastCheckedAt'].replace('Z', '+00:00'))
          age_hours = (datetime.now(timezone.utc) - checked).total_seconds() / 3600
          print(f"MongoDB backup last checked: {age_hours:.2f} hours ago")
          if age_hours > 26:
              raise SystemExit('MongoDB backup workflow has not successfully checked the database for more than 26 hours')
          if not data.get('fingerprint'):
              raise SystemExit('MongoDB backup metadata has no database fingerprint')
          if not data.get('currentPath'):
              raise SystemExit('MongoDB backup metadata has no current backup path')
          PY

          CURRENT_PATH=$(python - <<'PY'
          import json
          with open('/tmp/mongodb-latest.json', encoding='utf-8') as f:
              print(json.load(f)['currentPath'])
          PY
          )
          rclone size "$CURRENT_PATH"
          echo "MongoDB backup is present and its change fingerprint is recorded."

      - name: Failure notice
        if: failure()
        run: |
          echo "BACKUP HEALTH CHECK FAILED. Treat backups as stale and inspect GitHub Actions immediately."