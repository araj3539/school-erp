name: Backup R2 to Backblaze B2

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Install rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash
          rclone version

      - name: Configure R2 and B2 remotes
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
        run: |
          test -n "$R2_ACCOUNT_ID"
          test -n "$R2_ACCESS_KEY_ID"
          test -n "$R2_SECRET_ACCESS_KEY"
          test -n "$R2_BUCKET_NAME"
          test -n "$B2_KEY_ID"
          test -n "$B2_APPLICATION_KEY"
          test -n "$B2_BUCKET_NAME"
          test -n "$B2_ENDPOINT"

          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = $R2_ACCESS_KEY_ID
          secret_access_key = $R2_SECRET_ACCESS_KEY
          endpoint = https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com
          acl = private

          [b2]
          type = s3
          provider = Other
          access_key_id = $B2_KEY_ID
          secret_access_key = $B2_APPLICATION_KEY
          endpoint = $B2_ENDPOINT
          acl = private
          EOF

      - name: Verify storage access
        env:
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
        run: |
          rclone lsd "r2:${R2_BUCKET_NAME}"
          rclone lsd "b2:${B2_BUCKET_NAME}"

      - name: Sync R2 to B2
        env:
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
        run: |
          rclone sync "r2:${R2_BUCKET_NAME}" "b2:${B2_BUCKET_NAME}" \
            --fast-list \
            --transfers 4 \
            --checkers 8 \
            --retries 3 \
            --low-level-retries 10 \
            --stats 30s

      - name: Verify backup
        env:
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
        run: |
          rclone size "b2:${B2_BUCKET_NAME}"
