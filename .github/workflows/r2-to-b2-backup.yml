name: Backup R2 to Backblaze B2

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

concurrency:
  group: school-erp-r2-b2-backup
  cancel-in-progress: false

permissions:
  contents: read

env:
  RECOVERY_PREFIX: recovery/r2-deleted
  RECOVERY_RETENTION_DAYS: 60

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Install rclone
        run: |
          set -euo pipefail
          curl -fsSL https://rclone.org/install.sh | sudo bash
          rclone version

      - name: Configure R2 and B2 remotes
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
        run: |
          set -euo pipefail
          for value in R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET_NAME B2_KEY_ID B2_APPLICATION_KEY B2_BUCKET_NAME; do
            test -n "${!value}" || { echo "Missing required secret: $value"; exit 1; }
          done
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = $R2_ACCESS_KEY_ID
          secret_access_key = $R2_SECRET_ACCESS_KEY
          endpoint = https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com

          [b2]
          type = b2
          account = $B2_KEY_ID
          key = $B2_APPLICATION_KEY
          EOF

      - name: Verify storage access
        env:
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
        run: |
          set -euo pipefail
          rclone lsd "r2:${R2_BUCKET_NAME}"
          rclone lsd "b2:${B2_BUCKET_NAME}"

      - name: Sync current R2 files to B2 mirror
        id: sync
        env:
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
        run: |
          set -euo pipefail
          : > /tmp/r2-changes.txt

          # Compare by content checksum rather than R2 modification time. This
          # prevents re-uploading an unchanged document just because its remote
          # metadata/mtime differs from B2.
          rclone sync "r2:${R2_BUCKET_NAME}" "b2:${B2_BUCKET_NAME}" \
            --checksum \
            --exclude "${RECOVERY_PREFIX}/**" \
            --exclude "metadata/**" \
            --combined /tmp/r2-changes.txt \
            --fast-list \
            --transfers 4 \
            --checkers 8 \
            --retries 3 \
            --low-level-retries 10 \
            --stats 30s

          if grep -Eq '^[+*-] ' /tmp/r2-changes.txt; then
            echo "R2 content changes detected and synchronized to B2."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Changed objects:"
            grep -E '^[+*-] ' /tmp/r2-changes.txt || true
          else
            echo "No R2 content changes detected."
            echo "Already backed up — no document content was uploaded."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Remove old B2 versions from current document mirror
        env:
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
        run: |
          set -euo pipefail
          # B2 always keeps object versions by default. The schools prefix is
          # intentionally a current-only mirror because application-level
          # replacement/deletion history is already stored under recovery/.
          # rclone cleanup removes all old B2 versions under this path while
          # leaving each current object intact.
          if rclone lsd "b2:${B2_BUCKET_NAME}/schools" >/dev/null 2>&1; then
            rclone cleanup "b2:${B2_BUCKET_NAME}/schools" --fast-list --stats 30s
          else
            echo "B2 schools prefix is currently empty; nothing to clean."
          fi

      - name: Verify schools mirror has no old versions
        env:
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
        run: |
          set -euo pipefail
          if rclone lsd "b2:${B2_BUCKET_NAME}/schools" >/dev/null 2>&1; then
            rclone --b2-versions lsf "b2:${B2_BUCKET_NAME}/schools" --files-only > /tmp/schools-versions.txt
            if grep -Eq -- '-v[0-9]{8}-[0-9]{6}-[0-9]{3}(\.[^/]*)?$' /tmp/schools-versions.txt; then
              echo "ERROR: old B2 versions still exist under schools/."
              echo "Remaining versions:"
              grep -E -- '-v[0-9]{8}-[0-9]{6}-[0-9]{3}(\.[^/]*)?$' /tmp/schools-versions.txt
              exit 1
            fi
            echo "Verified: schools/ contains current objects only; no old B2 versions remain."
          else
            echo "B2 schools prefix is currently empty; nothing to verify."
          fi

      - name: Load previous backup manifest
        env:
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
        run: |
          set -euo pipefail
          if ! rclone cat "b2:${B2_BUCKET_NAME}/metadata/r2-latest-manifest.json" > /tmp/r2-manifest-existing.json 2>/dev/null; then
            : > /tmp/r2-manifest-existing.json
          fi

      - name: Remove recovery copies older than 60 days
        env:
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
        run: |
          set -euo pipefail
          rclone delete "b2:${B2_BUCKET_NAME}/${RECOVERY_PREFIX}" --min-age "${RECOVERY_RETENTION_DAYS}d" --fast-list --stats 30s
          rclone rmdirs "b2:${B2_BUCKET_NAME}/${RECOVERY_PREFIX}" --leave-root || true

      - name: Write current backup manifest
        env:
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
        run: |
          set -euo pipefail
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          rclone size "r2:${R2_BUCKET_NAME}" --json > /tmp/r2-size.json
          R2_COUNT=$(python -c 'import json; print(json.load(open("/tmp/r2-size.json"))["count"])')
          R2_BYTES=$(python -c 'import json; print(json.load(open("/tmp/r2-size.json"))["bytes"])')
          PREVIOUS_CHANGED_AT=$(python - <<'PY'
          import json
          from pathlib import Path
          try:
              data = json.loads(Path('/tmp/r2-manifest-existing.json').read_text(encoding='utf-8'))
              print(data.get('lastChangedAt') or data.get('completedAt') or '')
          except Exception:
              print('')
          PY
          )
          LAST_CHANGED_AT="$PREVIOUS_CHANGED_AT"
          if [[ "${{ steps.sync.outputs.changed }}" == "true" ]]; then
            LAST_CHANGED_AT="$NOW"
          fi

          cat > /tmp/r2-manifest.json <<EOF
          {
            "source": "r2",
            "destination": "b2",
            "lastCheckedAt": "$NOW",
            "lastChangedAt": "$LAST_CHANGED_AT",
            "objectCount": $R2_COUNT,
            "bytes": $R2_BYTES,
            "mode": "current-sync-plus-application-recovery",
            "recoveryPrefix": "$RECOVERY_PREFIX",
            "recoveryRetentionDays": $RECOVERY_RETENTION_DAYS
          }
          EOF

          # Always keep one stable manifest. Its old B2 versions are cleaned so
          # repeated scheduled checks never create an unbounded metadata history.
          rclone copyto /tmp/r2-manifest.json "b2:${B2_BUCKET_NAME}/metadata/r2-latest-manifest.json"
          rclone backend cleanup-hidden "b2:${B2_BUCKET_NAME}/metadata"

      - name: Verify backup
        env:
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
        run: |
          set -euo pipefail
          rclone cat "b2:${B2_BUCKET_NAME}/metadata/r2-latest-manifest.json"
          echo "Backup completed: B2 current mirror matches R2; recovery snapshots are retained separately for 60 days."

      - name: Failure notice
        if: failure()
        run: echo "R2 -> B2 backup FAILED. Check this GitHub Actions run immediately."