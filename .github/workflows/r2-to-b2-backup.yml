name: Backup R2 to Backblaze B2

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Install rclone
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash
          rclone version

      - name: Configure R2 and B2 remotes
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
        run: |
          set -euo pipefail
          for value in R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET_NAME B2_KEY_ID B2_APPLICATION_KEY B2_BUCKET_NAME B2_ENDPOINT; do
            test -n "${!value}" || { echo "Missing required secret: $value"; exit 1; }
          done

          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = $R2_ACCESS_KEY_ID
          secret_access_key = $R2_SECRET_ACCESS_KEY
          endpoint = https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com
          acl = private

          [b2]
          type = s3
          provider = Other
          access_key_id = $B2_KEY_ID
          secret_access_key = $B2_APPLICATION_KEY
          endpoint = $B2_ENDPOINT
          acl = private
          EOF

      - name: Verify storage access
        env:
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
        run: |
          set -euo pipefail
          rclone lsd "r2:${R2_BUCKET_NAME}"
          rclone lsd "b2:${B2_BUCKET_NAME}"

      - name: Record R2 size
        env:
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          set -euo pipefail
          rclone size "r2:${R2_BUCKET_NAME}" --json > /tmp/r2-size.json
          R2_COUNT=$(python -c 'import json; print(json.load(open("/tmp/r2-size.json"))["count"])')
          R2_BYTES=$(python -c 'import json; print(json.load(open("/tmp/r2-size.json"))["bytes"])')
          echo "R2_COUNT=$R2_COUNT" >> "$GITHUB_ENV"
          echo "R2_BYTES=$R2_BYTES" >> "$GITHUB_ENV"
          echo "Current R2 objects: $R2_COUNT; bytes: $R2_BYTES"

      - name: Copy R2 to B2 without propagating deletions
        env:
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
        run: |
          set -euo pipefail
          rclone copy "r2:${R2_BUCKET_NAME}" "b2:${B2_BUCKET_NAME}" \
            --fast-list \
            --transfers 4 \
            --checkers 8 \
            --retries 3 \
            --low-level-retries 10 \
            --stats 30s

      - name: Write and upload backup manifest
        env:
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
        run: |
          set -euo pipefail
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          cat > /tmp/r2-manifest.json <<EOF
          {
            "source": "r2",
            "destination": "b2",
            "completedAt": "$NOW",
            "objectCount": $R2_COUNT,
            "bytes": $R2_BYTES,
            "mode": "copy",
            "deletionsPropagated": false
          }
          EOF
          rclone copyto /tmp/r2-manifest.json "b2:${B2_BUCKET_NAME}/metadata/r2-latest-manifest.json"
          rclone copyto /tmp/r2-manifest.json "b2:${B2_BUCKET_NAME}/metadata/r2-manifest-${NOW//:/-}.json"

      - name: Verify backup
        env:
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
        run: |
          set -euo pipefail
          rclone size "b2:${B2_BUCKET_NAME}"
          rclone cat "b2:${B2_BUCKET_NAME}/metadata/r2-latest-manifest.json"
          echo "R2 backup completed successfully. B2 retains files removed from R2."

      - name: Failure notice
        if: failure()
        run: |
          echo "R2 -> B2 backup FAILED. Check this GitHub Actions run immediately."
