name: Backup R2 to Backblaze B2

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  RECOVERY_PREFIX: recovery/r2-deleted
  RECOVERY_RETENTION_DAYS: 60

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Install rclone
        run: |
          set -euo pipefail
          curl -fsSL https://rclone.org/install.sh | sudo bash
          rclone version

      - name: Configure R2 and B2 remotes
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
        run: |
          set -euo pipefail
          for value in R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET_NAME B2_KEY_ID B2_APPLICATION_KEY B2_BUCKET_NAME; do
            test -n "${!value}" || { echo "Missing required secret: $value"; exit 1; }
          done
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = $R2_ACCESS_KEY_ID
          secret_access_key = $R2_SECRET_ACCESS_KEY
          endpoint = https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com

          [b2]
          type = b2
          account = $B2_KEY_ID
          key = $B2_APPLICATION_KEY
          EOF

      - name: Verify storage access
        env:
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
        run: |
          set -euo pipefail
          rclone lsd "r2:${R2_BUCKET_NAME}"
          rclone lsd "b2:${B2_BUCKET_NAME}"

      - name: Sync current R2 files to B2 mirror
        env:
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
        run: |
          set -euo pipefail
          # Only the current-file mirror is synchronized. Recovery snapshots and
          # backup metadata are explicitly excluded so sync never deletes them.
          rclone sync "r2:${R2_BUCKET_NAME}" "b2:${B2_BUCKET_NAME}" \
            --exclude "${RECOVERY_PREFIX}/**" \
            --exclude "metadata/**" \
            --fast-list \
            --transfers 4 \
            --checkers 8 \
            --retries 3 \
            --low-level-retries 10 \
            --stats 30s

      - name: Remove recovery copies older than 60 days
        env:
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
        run: |
          set -euo pipefail
          rclone delete "b2:${B2_BUCKET_NAME}/${RECOVERY_PREFIX}" --min-age "${RECOVERY_RETENTION_DAYS}d" --fast-list --stats 30s
          rclone rmdirs "b2:${B2_BUCKET_NAME}/${RECOVERY_PREFIX}" --leave-root || true

      - name: Write backup manifest
        env:
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
        run: |
          set -euo pipefail
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          rclone size "r2:${R2_BUCKET_NAME}" --json > /tmp/r2-size.json
          R2_COUNT=$(python -c 'import json; print(json.load(open("/tmp/r2-size.json"))["count"])')
          R2_BYTES=$(python -c 'import json; print(json.load(open("/tmp/r2-size.json"))["bytes"])')
          cat > /tmp/r2-manifest.json <<EOF
          {
            "source": "r2",
            "destination": "b2",
            "completedAt": "$NOW",
            "objectCount": $R2_COUNT,
            "bytes": $R2_BYTES,
            "mode": "current-sync-plus-application-recovery",
            "recoveryPrefix": "$RECOVERY_PREFIX",
            "recoveryRetentionDays": $RECOVERY_RETENTION_DAYS
          }
          EOF
          rclone copyto /tmp/r2-manifest.json "b2:${B2_BUCKET_NAME}/metadata/r2-latest-manifest.json"
          rclone copyto /tmp/r2-manifest.json "b2:${B2_BUCKET_NAME}/metadata/r2-manifest-${NOW//:/-}.json"

      - name: Verify backup
        env:
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
        run: |
          set -euo pipefail
          rclone cat "b2:${B2_BUCKET_NAME}/metadata/r2-latest-manifest.json"
          echo "Backup completed: B2 current mirror matches R2; recovery snapshots are retained separately for 60 days."

      - name: Failure notice
        if: failure()
        run: echo "R2 -> B2 backup FAILED. Check this GitHub Actions run immediately."