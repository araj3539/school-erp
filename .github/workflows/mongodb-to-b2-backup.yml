name: Backup MongoDB to Backblaze B2

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Install MongoDB Database Tools
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/mongodb-database-tools.deb \
            https://fastdl.mongodb.org/tools/db/mongodb-database-tools-ubuntu2404-x86_64-100.17.0.deb
          sudo apt-get update -qq
          sudo apt-get install -y /tmp/mongodb-database-tools.deb
          mongodump --version

      - name: Install rclone
        run: |
          set -euo pipefail
          curl -fsSL https://rclone.org/install.sh | sudo bash
          rclone version

      - name: Configure B2
        env:
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
        run: |
          set -euo pipefail
          for value in B2_KEY_ID B2_APPLICATION_KEY B2_BUCKET_NAME B2_ENDPOINT; do
            test -n "${!value}" || { echo "Missing required secret: $value"; exit 1; }
          done
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [b2]
          type = s3
          provider = Other
          access_key_id = $B2_KEY_ID
          secret_access_key = $B2_APPLICATION_KEY
          endpoint = $B2_ENDPOINT
          acl = private
          EOF

      - name: Verify B2 access
        env:
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
        run: |
          set -euo pipefail
          rclone lsd "b2:${B2_BUCKET_NAME}"

      - name: Create compressed MongoDB dump
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          set -euo pipefail
          test -n "$MONGODB_URI"
          mkdir -p /tmp/mongodb-backup
          mongodump \
            --uri="$MONGODB_URI" \
            --archive=/tmp/mongodb-backup/school-erp.archive.gz \
            --gzip
          test -s /tmp/mongodb-backup/school-erp.archive.gz
          sha256sum /tmp/mongodb-backup/school-erp.archive.gz | tee /tmp/mongodb-backup/sha256.txt
          ls -lh /tmp/mongodb-backup/school-erp.archive.gz

      - name: Upload database backup to B2
        env:
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
        run: |
          set -euo pipefail
          DATE=$(date -u +%Y/%m/%d)
          TIMESTAMP=$(date -u +%Y%m%dT%H%M%SZ)
          BASE="b2:${B2_BUCKET_NAME}/database/${DATE}/school-erp-${TIMESTAMP}"
          rclone copyto /tmp/mongodb-backup/school-erp.archive.gz "${BASE}.archive.gz"
          rclone copyto /tmp/mongodb-backup/sha256.txt "${BASE}.sha256"
          printf '%s\n' "${BASE}.archive.gz" > /tmp/mongodb-backup/latest-path.txt
          rclone copyto /tmp/mongodb-backup/latest-path.txt "b2:${B2_BUCKET_NAME}/metadata/mongodb-latest-path.txt"

      - name: Verify database backup
        env:
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
        run: |
          set -euo pipefail
          PATH_FILE=$(rclone cat "b2:${B2_BUCKET_NAME}/metadata/mongodb-latest-path.txt")
          test -n "$PATH_FILE"
          rclone size "$PATH_FILE"
          SHA_PATH="${PATH_FILE%.archive.gz}.sha256"
          rclone cat "$SHA_PATH" | head -n 1
          echo "MongoDB backup completed successfully."

      - name: Failure notice
        if: failure()
        run: |
          echo "MongoDB -> B2 backup FAILED. Check this GitHub Actions run immediately."
