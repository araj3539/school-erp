name: Backup MongoDB to Backblaze B2

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: school-erp-mongodb-backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Install MongoDB Database Tools
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/mongodb-database-tools.deb \
            https://fastdl.mongodb.org/tools/db/mongodb-database-tools-ubuntu2404-x86_64-100.17.0.deb
          sudo apt-get update -qq
          sudo apt-get install -y /tmp/mongodb-database-tools.deb
          mongodump --version

      - name: Install rclone
        run: |
          set -euo pipefail
          curl -fsSL https://rclone.org/install.sh | sudo bash
          rclone version

      - name: Configure B2
        env:
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
        run: |
          set -euo pipefail
          test -n "$B2_KEY_ID" || { echo "Missing required secret: B2_KEY_ID"; exit 1; }
          test -n "$B2_APPLICATION_KEY" || { echo "Missing required secret: B2_APPLICATION_KEY"; exit 1; }
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [b2]
          type = b2
          account = $B2_KEY_ID
          key = $B2_APPLICATION_KEY
          EOF

      - name: Verify B2 access
        env:
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
        run: |
          set -euo pipefail
          test -n "$B2_BUCKET_NAME" || { echo "Missing required secret: B2_BUCKET_NAME"; exit 1; }
          rclone lsd "b2:${B2_BUCKET_NAME}"

      - name: Create compressed MongoDB dump and fingerprint
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          set -euo pipefail
          test -n "$MONGODB_URI" || { echo "Missing required secret: MONGODB_URI"; exit 1; }
          mkdir -p /tmp/mongodb-backup
          mongodump \
            --uri="$MONGODB_URI" \
            --archive=/tmp/mongodb-backup/school-erp.archive.gz \
            --gzip
          test -s /tmp/mongodb-backup/school-erp.archive.gz
          sha256sum /tmp/mongodb-backup/school-erp.archive.gz | tee /tmp/mongodb-backup/sha256.txt
          ls -lh /tmp/mongodb-backup/school-erp.archive.gz

      - name: Detect database change
        id: change-check
        env:
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
        run: |
          set -euo pipefail
          CURRENT_SHA=$(awk '{print $1}' /tmp/mongodb-backup/sha256.txt)
          PREVIOUS_SHA=""
          PREVIOUS_PATH=""

          if rclone cat "b2:${B2_BUCKET_NAME}/metadata/mongodb-latest.json" > /tmp/mongodb-latest.json 2>/dev/null; then
            PREVIOUS_SHA=$(python - <<'PY'
          import json
          with open('/tmp/mongodb-latest.json', encoding='utf-8') as f:
              data = json.load(f)
          print(data.get('fingerprint', ''))
          PY
          )
            PREVIOUS_PATH=$(python - <<'PY'
          import json
          with open('/tmp/mongodb-latest.json', encoding='utf-8') as f:
              data = json.load(f)
          print(data.get('backupPath') or data.get('currentPath') or '')
          PY
          )
          fi

          echo "Current database fingerprint:  ${CURRENT_SHA}"
          echo "Previous database fingerprint: ${PREVIOUS_SHA:-<none>}"

          if [[ -n "$PREVIOUS_SHA" && "$CURRENT_SHA" == "$PREVIOUS_SHA" && -n "$PREVIOUS_PATH" ]] && \
             rclone size "$PREVIOUS_PATH" >/dev/null 2>&1; then
            NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            NOW="$NOW" python - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path('/tmp/mongodb-latest.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          data['lastCheckedAt'] = os.environ['NOW']
          data['databaseChanged'] = False
          path.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')
          PY
            rclone copyto /tmp/mongodb-latest.json "b2:${B2_BUCKET_NAME}/metadata/mongodb-latest.json"
            rclone backend cleanup-hidden "b2:${B2_BUCKET_NAME}/metadata"
            echo "No database changes detected."
            echo "Already backed up — no new B2 backup will be created."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -z "$PREVIOUS_SHA" ]]; then
            echo "No previous fingerprint found; creating the initial change-aware backup."
          elif [[ "$CURRENT_SHA" != "$PREVIOUS_SHA" ]]; then
            echo "Database changes detected; creating a new backup version."
          else
            echo "Previous backup object is unavailable; recreating the backup."
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Upload changed database backup to B2
        if: steps.change-check.outputs.changed == 'true'
        env:
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
        run: |
          set -euo pipefail
          DATE=$(date -u +%Y/%m/%d)
          TIMESTAMP=$(date -u +%Y%m%dT%H%M%SZ)
          HISTORY_BASE="b2:${B2_BUCKET_NAME}/database/history/${DATE}/school-erp-${TIMESTAMP}"
          CURRENT_BASE="b2:${B2_BUCKET_NAME}/database/current/school-erp"
          CURRENT_SHA=$(awk '{print $1}' /tmp/mongodb-backup/sha256.txt)

          rclone copyto /tmp/mongodb-backup/school-erp.archive.gz "${HISTORY_BASE}.archive.gz"
          rclone copyto /tmp/mongodb-backup/sha256.txt "${HISTORY_BASE}.sha256"
          rclone copyto /tmp/mongodb-backup/school-erp.archive.gz "${CURRENT_BASE}.archive.gz"
          rclone copyto /tmp/mongodb-backup/sha256.txt "${CURRENT_BASE}.sha256"

          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          cat > /tmp/mongodb-latest.json <<EOF
          {
            "status": "success",
            "fingerprint": "${CURRENT_SHA}",
            "backupPath": "${HISTORY_BASE}.archive.gz",
            "currentPath": "${CURRENT_BASE}.archive.gz",
            "createdAt": "${NOW}",
            "lastCheckedAt": "${NOW}",
            "databaseChanged": true
          }
          EOF
          rclone copyto /tmp/mongodb-latest.json "b2:${B2_BUCKET_NAME}/metadata/mongodb-latest.json"

          # B2 keeps old object versions by default. The history files above are
          # intentionally unique; only the stable current object should have one
          # retained version so it never accumulates redundant B2 versions.
          rclone backend cleanup-hidden "b2:${B2_BUCKET_NAME}/database/current"
          rclone backend cleanup-hidden "b2:${B2_BUCKET_NAME}/metadata"

      - name: Verify database backup
        env:
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
        run: |
          set -euo pipefail
          if [[ "${{ steps.change-check.outputs.changed }}" == "true" ]]; then
            CURRENT_PATH="b2:${B2_BUCKET_NAME}/database/current/school-erp.archive.gz"
            CURRENT_SHA=$(rclone cat "b2:${B2_BUCKET_NAME}/database/current/school-erp.sha256" | head -n 1 | awk '{print $1}')
            LATEST_SHA=$(rclone cat "b2:${B2_BUCKET_NAME}/metadata/mongodb-latest.json" | python -c 'import json,sys; print(json.load(sys.stdin)["fingerprint"])')
            test -n "$CURRENT_SHA"
            test "$CURRENT_SHA" = "$LATEST_SHA"
            rclone size "$CURRENT_PATH"
            echo "MongoDB backup completed successfully."
          else
            echo "MongoDB backup verification: skipped upload because the database was already backed up."
          fi

      - name: Failure notice
        if: failure()
        run: |
          echo "MongoDB -> B2 backup FAILED. Check this GitHub Actions run immediately."