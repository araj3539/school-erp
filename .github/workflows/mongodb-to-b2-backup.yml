name: Backup MongoDB to Backblaze B2

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: school-erp-mongodb-backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Install MongoDB Database Tools
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/mongodb-database-tools.deb https://fastdl.mongodb.org/tools/db/mongodb-database-tools-ubuntu2404-x86_64-100.17.0.deb
          sudo apt-get update -qq
          sudo apt-get install -y /tmp/mongodb-database-tools.deb
          mongodump --version
          bsondump --version

      - name: Install rclone
        run: |
          set -euo pipefail
          curl -fsSL https://rclone.org/install.sh | sudo bash
          rclone version

      - name: Configure B2
        env:
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
        run: |
          set -euo pipefail
          test -n "$B2_KEY_ID" || { echo "Missing required secret: B2_KEY_ID"; exit 1; }
          test -n "$B2_APPLICATION_KEY" || { echo "Missing required secret: B2_APPLICATION_KEY"; exit 1; }
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [b2]
          type = b2
          account = $B2_KEY_ID
          key = $B2_APPLICATION_KEY
          EOF

      - name: Verify B2 access
        env:
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
        run: |
          set -euo pipefail
          test -n "$B2_BUCKET_NAME" || { echo "Missing required secret: B2_BUCKET_NAME"; exit 1; }
          rclone lsd "b2:${B2_BUCKET_NAME}"

      - name: Create MongoDB dump and business-data fingerprint
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          set -euo pipefail
          test -n "$MONGODB_URI" || { echo "Missing required secret: MONGODB_URI"; exit 1; }
          mkdir -p /tmp/mongodb-backup

          # The archive is the actual full, restorable MongoDB backup. The
          # business-data fingerprint is used only to decide whether a new
          # historical snapshot is necessary.
          mongodump --uri="$MONGODB_URI" --archive=/tmp/mongodb-backup/school-erp.archive.gz --gzip --numParallelCollections=1
          test -s /tmp/mongodb-backup/school-erp.archive.gz
          sha256sum /tmp/mongodb-backup/school-erp.archive.gz | tee /tmp/mongodb-backup/sha256.txt

          # A directory dump gives us BSON files that can be canonicalized. Only
          # application data is fingerprinted: auditlogs and documentrecoveries
          # are operational history already represented by their dedicated
          # backup systems and must not make an otherwise unchanged DB look new.
          rm -rf /tmp/mongodb-fingerprint
          mongodump --uri="$MONGODB_URI" --out=/tmp/mongodb-fingerprint --numParallelCollections=1

          : > /tmp/mongodb-fingerprint-manifest.txt
          while IFS= read -r file; do
            rel="${file#/tmp/mongodb-fingerprint/}"
            collection="${rel%/*}"
            [[ "$collection" == "auditlogs" || "$collection" == "documentrecoveries" ]] && continue
            [[ "$rel" != *.bson ]] && continue

            if [[ "$collection" == "users" ]]; then
              digest=$(bsondump --type=json "$file" | jq -S -c 'del(.updatedAt, .lastLogin, .refreshTokenVersion)' | LC_ALL=C sort | sha256sum | awk '{print $1}')
            else
              digest=$(bsondump --type=json "$file" | jq -S -c 'del(.updatedAt)' | LC_ALL=C sort | sha256sum | awk '{print $1}')
            fi
            printf '%s  %s\n' "$rel" "$digest" >> /tmp/mongodb-fingerprint-manifest.txt
          done < <(find /tmp/mongodb-fingerprint -type f -name '*.bson' | LC_ALL=C sort)

          # An entirely empty data set is valid, so hash the manifest itself even
          # when no business collection currently contains documents.
          LC_ALL=C sort -o /tmp/mongodb-fingerprint-manifest.txt /tmp/mongodb-fingerprint-manifest.txt
          sha256sum /tmp/mongodb-fingerprint-manifest.txt | awk '{print $1}' | tee /tmp/mongodb-backup/fingerprint.txt
          echo "Fingerprint scope: business-data-v1"
          echo "Archive SHA-256: $(awk '{print $1}' /tmp/mongodb-backup/sha256.txt)"
          echo "Business-data fingerprint: $(cat /tmp/mongodb-backup/fingerprint.txt)"

      - name: Clean old MongoDB backup object versions
        env:
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
        run: |
          set -euo pipefail
          rclone backend cleanup-hidden "b2:${B2_BUCKET_NAME}/database/history"
          rclone backend cleanup-hidden "b2:${B2_BUCKET_NAME}/database/current"

      - name: Detect database change
        id: change-check
        env:
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
        run: |
          set -euo pipefail
          CURRENT_FINGERPRINT=$(cat /tmp/mongodb-backup/fingerprint.txt)
          PREVIOUS_FINGERPRINT=""
          PREVIOUS_PATH=""
          PREVIOUS_SCOPE=""
          rm -f /tmp/mongodb-latest.json

          if rclone cat "b2:${B2_BUCKET_NAME}/metadata/mongodb-latest.json" > /tmp/mongodb-latest.json 2>/dev/null && [[ -s /tmp/mongodb-latest.json ]]; then
            if python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/mongodb-latest.json').read_text(encoding='utf-8'))
          if not data.get('fingerprint') or not (data.get('backupPath') or data.get('currentPath')):
              raise ValueError('missing fingerprint or backup path')
          PY
            then
              PREVIOUS_FINGERPRINT=$(python -c 'import json; print(json.load(open("/tmp/mongodb-latest.json", encoding="utf-8"))["fingerprint"])')
              PREVIOUS_PATH=$(python -c 'import json; d=json.load(open("/tmp/mongodb-latest.json", encoding="utf-8")); print(d.get("backupPath") or d.get("currentPath") or "")')
              PREVIOUS_SCOPE=$(python -c 'import json; print(json.load(open("/tmp/mongodb-latest.json", encoding="utf-8")).get("fingerprintScope", ""))')
            else
              echo "Previous MongoDB metadata is invalid; treating this as an initial backup."
            fi
          else
            echo "No usable previous MongoDB metadata found; creating an initial backup."
          fi

          echo "Current business-data fingerprint:  ${CURRENT_FINGERPRINT}"
          echo "Previous business-data fingerprint: ${PREVIOUS_FINGERPRINT:-<none>}"
          echo "Previous fingerprint scope:          ${PREVIOUS_SCOPE:-<legacy/full-db>}"

          if [[ "$PREVIOUS_SCOPE" == "business-data-v1" && -n "$PREVIOUS_FINGERPRINT" && "$CURRENT_FINGERPRINT" == "$PREVIOUS_FINGERPRINT" && -n "$PREVIOUS_PATH" ]] && rclone size "$PREVIOUS_PATH" >/dev/null 2>&1; then
            NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            NOW="$NOW" python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('/tmp/mongodb-latest.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          data['lastCheckedAt'] = os.environ['NOW']
          data['databaseChanged'] = False
          path.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')
          PY
            rclone copyto /tmp/mongodb-latest.json "b2:${B2_BUCKET_NAME}/metadata/mongodb-latest.json"
            rclone backend cleanup-hidden "b2:${B2_BUCKET_NAME}/metadata"
            echo "No business-data changes detected."
            echo "Audit logs, document-recovery records, and timestamp-only changes do not create a new MongoDB snapshot."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$PREVIOUS_SCOPE" != "business-data-v1" ]]; then
            echo "Fingerprint scope changed; creating one migration snapshot using the new business-data definition."
          elif [[ -z "$PREVIOUS_FINGERPRINT" ]]; then
            echo "No previous fingerprint found; creating the initial backup."
          elif [[ "$CURRENT_FINGERPRINT" != "$PREVIOUS_FINGERPRINT" ]]; then
            echo "Business-data changes detected; creating a new backup version."
          else
            echo "Previous backup object is unavailable; recreating the backup."
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Upload changed database backup to B2
        if: steps.change-check.outputs.changed == 'true'
        env:
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
        run: |
          set -euo pipefail
          DATE=$(date -u +%Y/%m/%d)
          TIMESTAMP=$(date -u +%Y%m%dT%H%M%SZ)
          HISTORY_BASE="b2:${B2_BUCKET_NAME}/database/history/${DATE}/school-erp-${TIMESTAMP}"
          CURRENT_BASE="b2:${B2_BUCKET_NAME}/database/current/school-erp"
          ARCHIVE_SHA=$(awk '{print $1}' /tmp/mongodb-backup/sha256.txt)
          DATABASE_FINGERPRINT=$(cat /tmp/mongodb-backup/fingerprint.txt)

          rclone copyto /tmp/mongodb-backup/school-erp.archive.gz "${HISTORY_BASE}.archive.gz"
          rclone copyto /tmp/mongodb-backup/sha256.txt "${HISTORY_BASE}.sha256"
          rclone copyto /tmp/mongodb-backup/school-erp.archive.gz "${CURRENT_BASE}.archive.gz"
          rclone copyto /tmp/mongodb-backup/sha256.txt "${CURRENT_BASE}.sha256"

          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          cat > /tmp/mongodb-latest.json <<EOF
          {
            "status": "success",
            "fingerprintScope": "business-data-v1",
            "fingerprint": "${DATABASE_FINGERPRINT}",
            "archiveSha256": "${ARCHIVE_SHA}",
            "backupPath": "${HISTORY_BASE}.archive.gz",
            "currentPath": "${CURRENT_BASE}.archive.gz",
            "createdAt": "${NOW}",
            "lastCheckedAt": "${NOW}",
            "databaseChanged": true
          }
          EOF
          python -m json.tool /tmp/mongodb-latest.json >/dev/null
          rclone copyto /tmp/mongodb-latest.json "b2:${B2_BUCKET_NAME}/metadata/mongodb-latest.json"
          rclone backend cleanup-hidden "b2:${B2_BUCKET_NAME}/database/history"
          rclone backend cleanup-hidden "b2:${B2_BUCKET_NAME}/database/current"
          rclone backend cleanup-hidden "b2:${B2_BUCKET_NAME}/metadata"

      - name: Verify database backup
        env:
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
        run: |
          set -euo pipefail
          if [[ "${{ steps.change-check.outputs.changed }}" == "true" ]]; then
            CURRENT_PATH="b2:${B2_BUCKET_NAME}/database/current/school-erp.archive.gz"
            CURRENT_ARCHIVE_SHA=$(rclone cat "b2:${B2_BUCKET_NAME}/database/current/school-erp.sha256" | head -n 1 | awk '{print $1}')
            LATEST_ARCHIVE_SHA=$(rclone cat "b2:${B2_BUCKET_NAME}/metadata/mongodb-latest.json" | python -c 'import json,sys; print(json.load(sys.stdin)["archiveSha256"])')
            test -n "$CURRENT_ARCHIVE_SHA"
            test "$CURRENT_ARCHIVE_SHA" = "$LATEST_ARCHIVE_SHA"
            rclone size "$CURRENT_PATH"
            echo "MongoDB backup completed successfully."
          else
            echo "MongoDB backup verification: skipped upload because business data was already backed up."
          fi

      - name: Failure notice
        if: failure()
        run: echo "MongoDB -> B2 backup FAILED. Check this GitHub Actions run immediately."