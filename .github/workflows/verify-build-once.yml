name: Verify build once

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "client/**"
      - "shared/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/verify-build-once.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Build all workspaces
        run: npm run build

      - name: Remove one-time workflow
        run: |
          rm .github/workflows/verify-build-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/verify-build-once.yml
          git commit -m "chore(ci): remove one-time build verification"
          git push
