name: Regenerate lockfile once

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "server/package.json"
      - "client/package.json"
      - "shared/package.json"
      - ".github/workflows/regenerate-lockfile-once.yml"

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Regenerate root lockfile
        run: npm install --package-lock-only --include=dev --ignore-scripts

      - name: Remove one-time workflow
        run: rm .github/workflows/regenerate-lockfile-once.yml

      - name: Commit regenerated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/regenerate-lockfile-once.yml
          if git diff --cached --quiet; then
            echo "No lockfile changes required."
          else
            git commit -m "chore(deps): regenerate lockfile"
            git push
          fi
